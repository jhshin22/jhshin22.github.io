 ['갈매기가 표를 물었다','주황 칸에 바늘이 들어오면 낚아채자.','승차권 낚아채기','갈매기 단독 상경','서울 친구들이 마중 나갔다. 7호차에서 내린 건 표 한 장과 갈매기였다. 민우는 부산역에서 새우깡을 환불 중이다.'],
 ['캐리어가 출고 대기 중','가방 손잡이에 신차 출고표가 붙었다. 로봇 팔이 타이어를 끼우기 전에 표를 떼자.','출고표 떼기','축하합니다, 첫 차 나왔습니다','단톡방에 신차 출고 사진이 올라왔다. 바퀴 네 개에 전조등까지 달린 민우의 캐리어였다. “민우야, 그거 타고 와.”'],
 ['환승 시간, 딱 한 입','따끈한 납작만두 앞에서 발이 멈췄다. 주황 칸에서 젓가락을 내려놓자.','젓가락 내려놓기','민우는 지금 굽는 중','“다음 판만 먹고 갈게.” 사장님이 앞치마를 건넸다. 서울 친구들 단톡방에 만두집 영업시간이 올라왔다.'],
 ['튀김소보로 한정 수량','빵집 줄과 승차 줄이 갈라진다. 주황 칸에서 승강장 쪽으로 빠지자.','빵집 줄 탈출하기','빵만 서울 도착','민우가 빵 상자를 선반에 올리고 커피를 사러 내렸다. 친구들은 저녁 대신 민우가 보낸 빵을 먹었다.'],
 ['드디어 서울 코앞','문이 닫힌다. 주황 칸에 맞춰 마지막 열차에 올라타자.','마지막 열차 타기','광명에서 찾은 서울','“서울 다 왔다!” 민우가 보낸 인증샷을 확대했다. 광명역 벽에 붙은 서울 관광 포스터였다.']
];
const route=$('.route'),meter=$('.meter'),button=$('#action');
for(const name of stops){const s=document.createElement('span');s.className='station';s.textContent=name;route.append(s)}
let stage=0,mode='ready',trip=0,start=0,width=0,frame=0;
function station(i){Array.from(route.children).forEach((s,n)=>s.classList.toggle('on',n===i))}
function words(title,copy,action){$('#title').textContent=title;$('#copy').textContent=copy;button.textContent=action}
const pictureLabels=[
 ['갈매기가 가방에서 승차권을 낚아챈다','자동차 출고표가 달린 캐리어와 조립 로봇','노릇한 납작만두를 들어 올린 젓가락','열차 문 앞에 선 튀김소보로 봉투','닫히는 열차 문에 낀 여행 가방'],
 ['승차권을 들고 창가에 앉은 갈매기','네 바퀴와 전조등을 달고 출고되는 캐리어','앞치마를 두른 커다란 납작만두','혼자 창가 좌석에 앉은 빵 봉투','텅 빈 승강장의 서울 관광 포스터'],
 ['갈매기 깃털 옆에 놓인 검표된 승차권','열차 좌석의 캐리어와 출고표만 집은 로봇 팔','빈 만두 팬에 내려놓은 젓가락','빵 부스러기를 달고 기차에 오른 여행 가방','서울 풍경을 배경으로 불판에서 기다리는 마지막 고기 한 점']
];
function picture(stop,row){
 const card=$('#postcard');
 const ulsan=stops[stop]==='울산';
 card.classList.toggle('ulsan',ulsan);
 const column=stop>1 ? stop-1 : stop;
 card.style.backgroundPosition=ulsan ? (row*50)+'% 0%' : (column*100/3)+'% '+(row*50)+'%';
 card.setAttribute('aria-label',pictureLabels[row][stop]);
}
function scene(i){
 const ctx=$('canvas').getContext('2d');
 function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
 const sky=['#a8dcce','#a6cfce','#c5dfca','#f1d298','#f0ba91','#ffc890'][i];
 rect(0,0,320,87,sky);rect(254,8,18,18,'#fff0af');
 for(let k=0;k<21;k++){let h=9+(k*17+i*7)%23;rect(k*17,52-h,14,h,'#78a59a');rect(k*17+3,54-h,2,3,sky)}
 rect(0,52,320,35,'#5ca79f');
 for(let k=0;k<12;k++)rect((k*31)%320,61+k%4*5,11,1,'#a7d2b2');
 for(let k=0;k<5;k++){let x=k*80;rect(x,34,3,44,'#365b55');for(let j=0;j<40;j++){const y=35+Math.round(14*Math.sin(j*Math.PI/40));rect(x+j*2,y,2,1,'#365b55');if(j%5===0)rect(x+j*2,y,1,56-y,'#365b55')}}
 rect(0,56,320,3,'#365b55');rect(0,73,320,4,'#233c3c');for(let k=0;k<40;k++)rect(k*9,77,4,3,'#69533f');
 const x=78+i*15;for(let k=0;k<3;k++){let a=x+k*37;rect(a,59,35,12,'#233c3c');rect(a+1,58,32,10,'#fff4d4');rect(a+1,66,33,3,'#cf5133');for(let j=0;j<4;j++)rect(a+3+j*7,60,5,4,'#34535a');rect(a+4,70,4,3,'#213532');rect(a+26,70,4,3,'#213532')}
}
const rounds=[
 {hits:2,width:19,period:1450,seconds:8,drift:0},
 {hits:2,width:18,period:1390,seconds:8,drift:2},
 {hits:2,width:16,period:1330,seconds:7,drift:4},
 {hits:3,width:14,period:1240,seconds:8,drift:7},
 {hits:4,width:10,period:1080,seconds:6,drift:11}
];
const TOUCH_GRACE_MS=45;
let hits,base,direction,deadline,phase,targetSince;
function setTarget(){
 targetSince=performance.now();
 const side=(hits+stage+trip)%2;
 base=(side?58:17)+Math.random()*9;
 direction=(side?1:-1)*(stage%2?-1:1);
 $('.zone').textContent=direction===1?'→':'←';
 $('#hits').textContent='검표 '+hits+' / '+rounds[stage].hits+'회';
}
function hideMeter(){
 cancelAnimationFrame(frame);meter.hidden=true;$('#status').hidden=true;
}
function missed(reason,t=deadline){
 picture(stage,1);
 cancelAnimationFrame(frame);
 draw(t);
 meter.classList.add('failed');
 const arrow=poseAt(t).dir===1?'→':'←';
 $('#hits').textContent=stops[stage]+'역 · '+(hits+1)+'번째 검표';
 $('#clock').textContent=(t===deadline?'시간 종료 위치 ':'누른 위치 ')+arrow;
 mode='end';
 words(stages[stage][3],reason+' '+stages[stage][4],'이번엔 진짜 간다 ↻');
 $('#sign').textContent=stops[stage]+'역에서 발이 묶였다';
 $('#ticket').textContent='제 '+trip+'회 상경 시도 · 서울행 실패';
}
function poseAt(t){
 const r=rounds[stage],elapsed=t-start;
 const cycle=((elapsed/r.period+phase)%1+1)%1;
 const left=base+r.drift*Math.sin(elapsed/430+phase);
 return {left,p:100*(1-Math.abs(2*cycle-1)),dir:cycle<0.5?1:-1};
}
function draw(t){
 const shown=poseAt(t);
 $('.zone').style.left=shown.left+'%';
 $('.needle').style.left=shown.p+'%';
 $('#clock').textContent='막차까지 '+(Math.max(0,deadline-t)/1000).toFixed(1)+'초';
}
function tick(t){
 if(t>=deadline){missed('막차 출발!');return}
 draw(t);frame=requestAnimationFrame(tick);
}
function play(){
 meter.classList.remove('failed');
 picture(stage,0);
 mode='play';station(stage);scene(stage);$('#sign').textContent=stops[stage]+'역 → '+stops[stage+1]+'역';
 const s=stages[stage],r=rounds[stage];words(s[0],s[1]+' 화살표 방향으로 통과할 때만!',s[2]);
 hits=0;width=r.width;phase=Math.random();setTarget();
 $('.zone').style.width=width+'%';meter.hidden=false;$('#status').hidden=false;
 start=performance.now();deadline=start+r.seconds*1000;tick(start);
}
function stampTicket(){
 const stamp=$('#stamp');
 stamp.getAnimations().forEach(animation=>animation.cancel());
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 stamp.animate([
  {opacity:1,transform:reduced?'rotate(-8deg)':'rotate(-13deg) scale(1.15)'},
  {opacity:1,transform:'rotate(-8deg)',offset:0.65},
  {opacity:0,transform:'rotate(-8deg)'}
 ],{duration:320,easing:'ease-out'});
}
function activate(t,grace=0){
 if(mode==='ready'||mode==='end'){trip++;stage=0;$('#ticket').textContent='제 '+trip+'회 상경 시도 · 승객 박민우';play();return}
 if(mode==='next'){play();return}
 if(t>=deadline){missed('막차 출발!');return}
 if(t<targetSince)return;
 const current=poseAt(t);
 if(current.dir!==direction){missed('역방향 검표!',t);return}
 // Within one sweep, the needle overtakes even the fastest moving target.
 // Its signed offset therefore crosses the valid interval monotonically.
 const previous=poseAt(Math.max(targetSince,t-grace));
 const offset=current.p-current.left;
 const earlier=previous.dir===direction ? previous.p-previous.left : (direction===1 ? -100 : 100);
 if(Math.max(earlier,offset)<0 || Math.min(earlier,offset)>width){
  missed((direction===1 ? offset<0 : offset>width) ? '조금 일찍 눌렀다.' : '검표 칸을 지나쳤다.',t);return
 }
 hits++;
 stampTicket();
 if(hits<rounds[stage].hits){setTarget();draw(performance.now());return}
 hideMeter();
 picture(stage,2);
 if(stage===rounds.length-1){
  mode='end';station(stops.length-1);scene(stops.length-1);
  $('#sign').textContent='서울역 도착';
  $('#ticket').textContent='제 '+trip+'회 상경 시도 · 서울행 승차권 사용 완료';
  words('민우야, 진짜 왔네?','서울역에서 민우가 손을 흔든다. 친구가 불판 한쪽에 숨겨 둔 마지막 고기 한 점을 건넸다. “야, 갈매기도 너보다 먼저 와서 먹고 갔다.”','부산에서 다시 출발 ↻');
  return
 }
 stage++;mode='next';station(stage);scene(stage);$('#sign').textContent=stops[stage]+'역 도착';words(stops[stage]+'까지 왔다!', ['민우가 표를 되찾았다. 갈매기는 입석이다.','출고표만 쏙 뽑았다. 동대구행 열차에 짐을 싣는데 카센터에서 첫 정기점검 문자가 왔다.','젓가락을 놓고 가까스로 탔다. 주머니에서 간장 냄새가 난다.','빵 냄새를 뿌리치고 광명 도착. 친구가 이제 불판을 갈았다.'][stage-1],'다음 승강장으로 →')
}
let handledPress=false;
button.onpointerdown=event=>{
 if(!event.isPrimary || event.button!==0)return;
 handledPress=event.pointerType==='touch' && mode==='play';
 if(handledPress)activate(event.timeStamp,TOUCH_GRACE_MS);
};
button.onclick=event=>{
 if(event.detail!==0 && handledPress)return;
 activate(event.timeStamp);
};
station(0);scene(0)
</script></body></html>
